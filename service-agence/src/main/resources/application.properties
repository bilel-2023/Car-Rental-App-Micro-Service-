# No security-related properties at all
spring.application.name=service-agence
server.port=8090

spring.config.import=optional:configserver:http://localhost:8888
# Database
spring.datasource.url=jdbc:mysql://localhost:3306/agency_db?useSSL=false
spring.datasource.username=${dbuser}
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Feign
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

# Logging
logging.level.com.location.voitures.agence=DEBUG
logging.level.feign=DEBUG

file.upload-dir=uploads
# Show all Spring Security events (if any security is left)
logging.level.org.springframework.security=DEBUG
# Enable debug logging for filters
logging.level.org.springframework.web.filter=DEBUG
# Format logs to show thread names
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Spring Boot Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,env,beans,conditions,httptrace,loggers
management.endpoint.health.show-details=always

# Configure Zipkin
management.tracing.sampling.probability=1.0
spring.zipkin.base-url=http://localhost:9411
management.tracing.enabled=true
management.observations.http.server.requests.enabled=true
management.observations.http.client.requests.enabled=true